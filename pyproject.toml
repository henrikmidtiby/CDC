[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CDC"
dynamic = ["version"]
authors = [
  { name="Henrik Skov Midtiby", email="hemi@mmmi.sdu.dk" },
]
maintainers = [
  { name="Henrik Skov Midtiby", email="hemi@mmmi.sdu.dk" },
  { name="Henrik Dyrberg Egemose", email="hde@mmmi.sdu.dk" },
]
description = "Color distance calculator."
readme = "README.md"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "rasterio",
  "scikit-learn>=1.7.0",
  "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/henrikmidtiby/CDC"
Issues = "https://github.com/henrikmidtiby/CDC/issues"

[project.scripts]
CDC = "CDC.__main__:_main"

[tool.hatch.version]
path = "src/CDC/__init__.py"

[tool.pytest.ini_options]
addopts = "--cov=CDC --cov-report html:test_coverage"

[tool.codespell]
check-hidden = true
skip = ".git,venv,*.c"
ignore-words-list = "mor, FPR"

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "PGH",
  "PT",
  "SIM",
  "UP",
]

ignore = [
  # Doc string format currently not used
  "D205",
  "D401",
  # Use ternary operator instead of if/else
  "SIM108",
  # docstring ignores - conflicting rules
  "D203",
  "D212",
  # as recommended by https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E501",
  # still using D102 since docstring inherited is not supported in ruff"
  "D102",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "D104",
  "F401",
  "F403",
]
"tests/*" = ["D"]
"docs/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "mypy",
    "sphinx<9",
    "myst_parser",
    "furo",
    "sphinx_copybutton",
    "sphinx_reredirects",
    "sphinx-argparse",
]
